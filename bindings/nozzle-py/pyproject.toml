[project]
name = "nozzle-py"
version = "0.1.0"
description = "Python bindings for the nozzle Rust library"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[tool.maturin]
bindings = "pyo3"
module-name = "nozzle_py._core"
python-source = "src"
manifest-path = "../../Cargo.toml"
features = ["python"]

[dependency-groups]
dev = ["maturin>=1,<2", "pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
