<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>nozzle: workflow console</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6e9ea;--pn:#fbfcfc;--ink:#15191c;--mu:#5f6a70;--ln:#d0d6d8;--sel:#eef2f3;--ok:#26855a;--rn:#0b72c9;--bd:#cf3a2e;--am:#c7840b;--id:#97a3a9;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101416;--pn:#171d20;--ink:#e8eef0;--mu:#8a979d;--ln:#2a3338;--sel:#1e272b;--ok:#45b685;--rn:#4aa3f0;--bd:#ff7466;--am:#e9a93a;--id:#5d6a70;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101416;--pn:#171d20;--ink:#e8eef0;--mu:#8a979d;--ln:#2a3338;--sel:#1e272b;--ok:#45b685;--rn:#4aa3f0;--bd:#ff7466;--am:#e9a93a;--id:#5d6a70;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:13.5px/1.5 Inter,system-ui,sans-serif}
.app{display:grid;grid-template-columns:210px 1fr}
aside{background:var(--pn);border-right:1px solid var(--ln);padding:18px 12px}
.brand{display:flex;gap:8px;align-items:center;font:600 21px Inter,sans-serif;letter-spacing:-.03em;margin:0 6px 22px}
nav button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:6px;font:inherit;color:inherit;cursor:pointer}
nav button:hover{background:var(--sel)}nav button[aria-current=page]{background:var(--ink);color:var(--bg)}
.bg{background:var(--am);color:#fff;border-radius:9px;padding:0 7px;font-size:11px;font-weight:600}
.foot{margin:22px 6px 0;color:var(--mu);font-size:12px}
main{padding:20px clamp(14px,3vw,34px) 44px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between;align-items:center;margin-bottom:18px}
h1{font:600 24px "JetBrains Mono",monospace;letter-spacing:-.03em;margin:0}
.who,label{display:flex;gap:10px;align-items:center;color:var(--mu)}
select,input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:6px 10px}
input[type=text]{width:100%}
.role{border:1px solid var(--ln);border-radius:999px;padding:1px 10px;font-weight:500;color:var(--ink)}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:10px}
.ch{padding:12px 16px;border-bottom:1px solid var(--ln);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.mu{color:var(--mu)}.m,code{font-family:"JetBrains Mono",monospace;font-size:12.5px}
.pl{display:inline-flex;gap:7px;align-items:center;font-weight:500;white-space:nowrap}.pl i{width:8px;height:8px;border-radius:50%}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mu);font-weight:500;padding:9px 16px;border-bottom:1px solid var(--ln)}
td{padding:10px 16px;border-bottom:1px solid var(--ln)}tr:last-child td{border-bottom:0}
tr[data-run],tr[data-wf]{cursor:pointer}tr[data-run]:hover,tr[data-wf]:hover,tr.on{background:var(--sel)}
.b{font:inherit;font-weight:500;color:var(--ink);background:transparent;border:1px solid var(--ln);border-radius:6px;padding:5px 12px;cursor:pointer}
.pr{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.b:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible,pre:focus-visible{outline:2px solid var(--rn);outline-offset:2px}
.ban{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--sel);border-left:4px solid var(--am)}
.ban span{display:flex;gap:8px}
.sc{overflow-x:auto;padding:12px 14px}.lp{padding:4px 16px 16px}
pre{margin:0;font:12px/1.7 "JetBrains Mono",monospace;background:var(--bg);padding:12px;border-radius:6px;height:190px;overflow:auto;white-space:pre-wrap}
.lb{color:var(--bd)}.la{color:color-mix(in srgb,var(--am) 65%,var(--ink))}.lo{color:var(--ok)}.evs{padding:10px 16px;border-top:1px solid var(--ln)}.evs button{display:flex;gap:12px;width:100%;text-align:left;border:0;background:transparent;font:inherit;color:inherit;padding:3px 0;cursor:pointer}
.wf{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;margin-top:16px;align-items:start}.wm{min-width:0}
.rs{position:sticky;top:12px;display:grid;gap:12px;align-content:start;max-height:calc(100vh - 24px);overflow:auto}
.rl{display:grid;gap:4px;max-height:260px;overflow:auto}.ri{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;text-align:left;border:1px solid transparent;background:transparent;color:var(--ink);font:inherit;padding:6px 8px;border-radius:6px;cursor:pointer}.ri:hover,.ri.on{background:var(--sel)}.ri.on{border-color:var(--ln)}.ri .pl{margin-left:auto}
.lp.full{position:fixed;inset:16px;z-index:50;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}.lp.full .lgw{max-height:none;flex:1;min-height:0}.rs .card{padding:14px 16px}.rs h3{font:600 13px Inter,sans-serif;margin:0 0 8px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-top:1px solid var(--ln)}.kv>span:last-child{text-align:right;min-width:0}
.chip{font:11.5px "JetBrains Mono",monospace;border:1px solid var(--ln);background:transparent;color:var(--ink);border-radius:4px;padding:1px 6px;margin:0 0 3px 3px;cursor:pointer}
.bar6{height:6px;border-radius:3px;background:var(--ln);margin:6px 0 4px}.bar6 i{display:block;height:100%;border-radius:3px;background:var(--ok)}
@media (max-width:1200px){.wf{grid-template-columns:1fr}.rs{position:static;max-height:none;overflow:visible}}
.lgw{max-height:360px;overflow:auto;display:grid;gap:8px}.lgw pre{height:auto;min-height:60px}
.atm{border:1px solid var(--ln);border-radius:8px;overflow:hidden}
.at{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--bg);color:var(--ink);font:inherit;padding:9px 12px;cursor:pointer;text-align:left}
.at b{font-weight:600}.cv{flex:none;transition:transform .15s}.at[aria-expanded=true] .cv{transform:rotate(90deg)}
.alg{padding:10px 14px;font:12px/1.7 "JetBrains Mono",monospace;white-space:pre-wrap;background:var(--pn);border-top:1px solid var(--ln)}
.ap{padding:14px 16px;display:grid;gap:10px;margin-bottom:12px}.ar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ut{display:inline-block;width:90px;height:6px;border-radius:3px;background:var(--ln);vertical-align:middle;margin-right:8px}.ut i{display:block;height:100%;border-radius:3px;background:var(--rn)}
@media (prefers-reduced-motion:no-preference){.hold{animation:pu 1.6s ease-in-out infinite}@keyframes pu{50%{opacity:.45}}}
@media (max-width:800px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--ln);padding:12px}nav{display:flex;gap:4px;overflow-x:auto}nav button{width:auto;white-space:nowrap;gap:8px}.brand{margin-bottom:10px}.foot{display:none}}
</style>
</head>
<body>
<div class="app">
<aside>
 <div class="brand"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 3h18l-6.5 8v5l-3 2.5V11z"/><circle cx="12" cy="21.5" r="1.5"/></svg>nozzle</div>
 <nav id="nav" aria-label="Console sections"></nav>
 <p class="foot">Demo data. Switch the user at the top right and watch what each role can do.</p>
</aside>
<main>
 <div class="top"><h1 id="ttl"></h1><div class="who"><label>Acting as <select id="me"></select></label><span class="role" id="rl"></span></div></div>
 <div id="v"></div>
</main>
</div>
<script>
const $=i=>document.getElementById(i),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);

const U=[{id:'priya',n:'Priya Raman',role:'admin',team:'Platform'},{id:'marcus',n:'Marcus Webb',role:'operator',team:'Data Eng'},{id:'tomas',n:'Tomás Rivera',role:'approver',team:'Release Mgmt'},{id:'lena',n:'Lena Kovacs',role:'viewer',team:'Analytics'}];
const EX={
 lambda:{n:'aws-lambda-eu',kind:'AWS Lambda',s:'Lambda',loc:'eu-west-1',cap:50},
 ecs:{n:'ecs-batch-prod',kind:'AWS ECS',s:'ECS',loc:'eu-west-1, Fargate',cap:2},
 k8s:{n:'gke-core-1',kind:'Kubernetes',s:'K8s',loc:'europe-west4, 24 nodes',cap:10},
 eks:{n:'eks-analytics',kind:'Kubernetes',s:'K8s',loc:'us-east-1, 12 nodes',cap:3},
 cfc:{n:'cf-containers',kind:'Cloudflare Containers',s:'CF',loc:'global edge',cap:3}};
// task: [id, upstream, isGate, executor, introducedInVersion]
const PL={
 warehouse:{n:'nightly_warehouse_refresh',team:'Data Eng',cron:'0 2 * * *',V:[['Initial extract, transform and publish','Jun 02'],['Adds dbt tests before publish','Jul 14'],['Adds Slack notification','Sep 21']],T:[
  ['extract_orders',[],0,'lambda',1],['extract_events',[],0,'ecs',1],['validate_raw',['extract_orders','extract_events'],0,'lambda',1],['dbt_run',['validate_raw'],0,'eks',1],['dbt_test',['dbt_run'],0,'eks',2],['publish_marts',['dbt_test'],0,'cfc',1],['notify_slack',['publish_marts'],0,'lambda',3]]},
 release:{n:'release_train',team:'Release Mgmt',cron:'on merge to main',V:[['Build, test, scan and canary deploy','May 20'],['Adds production approval gate','Aug 03'],['Adds promotion to all regions','Oct 09']],T:[
  ['build_image',[],0,'k8s',1],['run_tests',['build_image'],0,'k8s',1],['scan_image',['build_image'],0,'ecs',1],['approve_prod_deploy',['run_tests','scan_image'],1,'',2],['deploy_canary',['approve_prod_deploy'],0,'k8s',1],['promote_all',['deploy_canary'],0,'k8s',3]]},
 purge:{n:'weekly_pii_purge',team:'Security',cron:'0 4 * * 0',V:[['Find and purge expired rows','Mar 11'],['Adds DPO approval gate before purge','Aug 29']],T:[
  ['find_expired',[],0,'ecs',1],['approve_purge',['find_expired'],2,'',2],['purge_rows',['approve_purge'],0,'eks',1],['notify_dpo',['purge_rows'],0,'cfc',1]]}
};
let me=U[1],RUNS=[],APR=[],AUD=[],seq=1038,selWf=null,selRun=null,selT=null,view='wf',vh='',nh='';
const can=p=>ROLES[me.role].includes(p);
const why=(r,a)=>!can('approve')?'Your role cannot decide approval gates':r.by===me.id?'You triggered this run, so a different approver must decide':a&&a.votes.some(v=>v.id===me.id)?'You already approved. Another approver must complete the quorum':'';
const un=id=>(U.find(u=>u.id===id)||{n:'schedule'}).n,hm=t=>new Date(t).toTimeString().slice(0,8);
const audit=(a,x,d)=>AUD.unshift({t:Date.now(),u:me.n,a,x,d});
const lg=(r,id,m,t=Date.now())=>{const k=r.k[id];(k.ln=k.ln||[]).push(k.a||1);k.log.push(hm(t)+'  '+m)};
const h4=()=>Math.random().toString(36).slice(2,6);
const startMsg=(x,id)=>{const e=EX[x];return e.s==='K8s'?`Pod ${id.replace(/_/g,'-')}-${h4()} scheduled on ${e.n}, image pulled`:e.s==='ECS'?`ECS task started on ${e.n} (Fargate, 1 vCPU, 2 GB)`:e.s==='Lambda'?`Invoked ${e.n}/${id}, request id ${h4()}-${h4()}`:`Container instance started at the edge via ${e.n}`};
const RC={'awaiting approval':'--am',running:'--rn',failed:'--bd',rejected:'--bd',success:'--ok',queued:'--id'};
const pill=(s,k=s)=>`<span class="pl"><i style="background:var(--${RC[k].slice(2)})"></i>${s}</span>`;
const rs=r=>{const v=Object.values(r.k).map(k=>k.s);return v.includes('hold')?'awaiting approval':v.includes('run')||v.includes('retry')?'running':v.includes('fail')?'failed':v.includes('rej')?'rejected':v.every(s=>s==='ok')?'success':'queued'};
function tasks(p,n){const all=PL[p].T,by={};all.forEach(t=>by[t[0]]=t);const inc=new Set(all.filter(t=>t[4]<=n).map(t=>t[0]));
 const up=id=>by[id][1].flatMap(u=>inc.has(u)?[u]:up(u));
 return all.filter(t=>inc.has(t[0])).map(t=>[t[0],[...new Set(up(t[0]))],t[2],t[3]])}
function newRun(p,by,v,ld){const r={id:'run_'+(seq++),p,by,v,ld,fm:{...PL[p].fm},T:tasks(p,v),t0:Date.now(),k:{}};r.T.forEach(([id])=>r.k[id]={s:'wait',p:0,m:0,log:[]});RUNS.unshift(r);return r}
function hist(p,by,m,h,v){const r=newRun(p,by,v);r.t0-=h*36e5;
 r.T.forEach(([id,,g,x],i)=>{const k=r.k[id],t=r.t0+i*9e3;k.s=m[id]||'ok';
  if(k.s==='skip')lg(r,id,'Upstream task did not succeed, marked UPSTREAM_FAILED',t);
  else if(g){lg(r,id,'Waiting for approval from group "approvers"',t);lg(r,id,k.s==='rej'?'Rejected by Tomás Rivera: Legal has not confirmed the retention window':'Approved by Tomás Rivera',t+4e4)}
  else if(k.s==='fail'){k.a=1;lg(r,id,startMsg(x,id),t);[1,2,3].forEach(a=>{k.a=a;const u=t+a*8e3;if(a>1)lg(r,id,`Attempt ${a} started: `+startMsg(x,id),u-4e3);lg(r,id,'AssertionError: 3 tests failed (test_checkout_totals)',u);lg(r,id,`Attempt ${a} failed, exit code 1`,u);ev(r,id,`Attempt ${a} of 3 failed`+(a<3?', retrying in '+a*2.5+'s':', retries exhausted'),u);if(a<3)lg(r,id,`Retrying in ${a*2.5}s with backoff, attempt ${a+1} of 3`,u+500)});lg(r,id,'Retries exhausted, marked FAILED',t+3e4)}
  else{lg(r,id,startMsg(x,id),t);lg(r,id,k.s==='fail'?'AssertionError: 3 tests failed (test_checkout_totals)\n'+hm(t+6e3)+'  Exit code 1, marked FAILED':'Exit code 0, marked SUCCESS',t+6e3)}});return r}
const sha=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h.toString(16).padStart(8,'0').slice(0,7)};
function diffTxt(p,v){if(v<2)return 'First version, nothing to compare.';const a=tasks(p,v-1).map(t=>t[0]),add=tasks(p,v).filter(t=>!a.includes(t[0])).map(t=>`<code>+ ${t[0]}</code> ${t[2]?'(approval gate'+(t[2]>1?', '+t[2]+' approvals':'')+')':'on '+EX[t[3]].s}`);return `Changes from v${v-1}: ${add.join(', ')||'none'}`}
function backfill(){const p=PL[selWf],v=p.sel||p.act||p.V.length;if(!can('run')||p.paused)return;['2026-10-13','2026-10-14','2026-10-15'].forEach(d=>newRun(selWf,me.id,v,d));audit(`backfilled ${p.n} on v${v}`,'3 runs','2026-10-13 to 2026-10-15');selRun=RUNS[0].id;selT=null;render()}
const SEC=[{n:'warehouse_dsn',t:'Postgres connection',u:'nightly_warehouse_refresh',r:'Sep 02'},{n:'slack_webhook_dataops',t:'Slack webhook',u:'nightly_warehouse_refresh',r:'Aug 14'},{n:'registry_pull_token',t:'Container registry token',u:'release_train',r:'Oct 01'},{n:'prod_kubeconfig',t:'Kubeconfig',u:'release_train',r:'Jul 19'},{n:'pii_db_admin',t:'Database credential',u:'weekly_pii_purge',r:'Sep 27'}];
const vSecrets=()=>{const ad=can('admin');return `<div class="card tw"><div class="ch"><b>Secrets and connections</b><span class="mu">Values are never shown. Workers receive them at run time.</span></div><table><tr><th>Name</th><th>Type</th><th>Used by</th><th>Last rotated</th><th></th></tr>${SEC.map((s,i)=>`<tr><td class="m">${s.n}</td><td>${s.t}</td><td class="m">${s.u}</td><td>${s.r}</td><td style="text-align:right"><button class="b" data-rot="${i}" ${ad?'':'disabled title="Only admins can rotate secrets"'}>Rotate</button></td></tr>`).join('')}</table></div>`};
const ev=(r,id,m,t=Date.now())=>(r.ev=r.ev||[]).push([t,id,m]);
const lh=a=>a.map(l=>`<span class="${/FAILED|failed|Rejected|Assertion/.test(l)?'lb':/Retry|Attempt \d started/.test(l)?'la':/SUCCESS|Approved/.test(l)?'lo':''}">${E(l)}</span>`).join('\n');
const OPEN={};let LOGX=false;
function atHtml(r,id){const k=r.k[id],N=k.ln||[],g={};k.log.forEach((l,i)=>(g[N[i]||1]=g[N[i]||1]||[]).push(l));
 const ns=Object.keys(g).map(Number).sort((a,b)=>a-b),last=ns[ns.length-1];
 return ns.map(n=>{const ls=g[n],txt=ls.join('\n'),key=r.id+'|'+id+'|'+n,
  st=/failed, exit code/.test(txt)?'failed':/SUCCESS/.test(txt)?'success':k.s==='run'&&n===(k.a||1)?'running':'queued',
  lab=st==='failed'&&k.s==='retry'&&n===k.a-1?'failed, retrying':st==='success'?'succeeded':st,
  open=OPEN[key]===undefined?n===last:OPEN[key];
  return `<div class="atm"><button class="at" data-at="${key}" aria-expanded="${open}"><svg class="cv" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><b>Attempt ${n}</b>${pill(lab,st)}<span class="mu m" style="margin-left:auto">${ls[0].slice(0,8)}</span></button>${open?`<div class="alg">${lh(ls)}</div>`:''}</div>`}).join('')}
const logHtml=(r,id)=>{const k=r.k[id];return !k.log.length?'<pre>No log yet. This task starts when its upstream tasks succeed.</pre>':r.T.find(t=>t[0]===id)[2]||k.s==='skip'?`<pre>${lh(k.log)}</pre>`:atHtml(r,id)};
function side(r,w,ac,L){
 const ids=r.T.map(t=>t[0]),K=ids.map(i=>r.k[i]),done=K.filter(k=>k.s==='ok').length,rt=K.reduce((n,k)=>n+Math.max(0,(k.a||1)-1),0),
  tk=r.T.find(t=>t[0]===selT),k=r.k[selT],gate=tk[2],x=tk[3],dn=r.T.filter(t=>t[1].includes(selT)).map(t=>t[0]),
  use=x?RUNS.reduce((n,y)=>n+y.T.filter(t=>t[3]===x&&y.k[t[0]].s==='run').length,0):0,
  lb={ok:['success','success'],run:['running','running'],retry:['retrying','running'],fail:['failed','failed'],skip:['skipped','queued'],hold:['awaiting approval','awaiting approval'],rej:['rejected','rejected'],wait:['waiting','queued']}[k.s],
  kv=(a,b)=>`<div class="kv"><span class="mu">${a}</span><span>${b}</span></div>`,
  cs=a=>a.length?a.map(i=>`<button class="chip" data-t="${i}">${i}</button>`).join(''):'<span class="mu">none</span>';
 return `<div class="card"><h3>Runs</h3><div class="rl">${L.map(x=>`<button class="ri${x.id===r.id?' on':''}" data-run="${x.id}" ${x.id===r.id?'aria-current="true"':''}><span class="m">${x.id}</span><span class="m mu">v${x.v}</span>${pill(rs(x))}<span class="mu" style="flex-basis:100%">${un(x.by)}${x.ld?', backfill '+x.ld:''}, ${hm(x.t0)}</span></button>`).join('')}</div></div>
 <div class="card"><h3 class="m">${r.id}</h3>${kv('Status',pill(rs(r)))}${kv('Version','v'+r.v)}${kv('Triggered by',un(r.by))}${kv('Started',hm(r.t0))}${kv('Retries',rt)}${kv('Progress',done+' of '+ids.length+' tasks')}<div class="bar6"><i style="width:${done/ids.length*100}%"></i></div></div>
 <div class="card"><h3 class="m">${selT}</h3>${kv('State',pill(lb[0],lb[1]))}${gate?kv('Type','Approval gate')+kv('Approvals needed',gate):kv('Executor',EX[x].n)+kv('Pool type',EX[x].kind)+kv('Pool use',use+' of '+EX[x].cap)+kv('Attempt',k.a?k.a+' of 3':'not started')+kv('Behaviour',['Healthy','Flaky','Broken'][(w.fm||{})[selT]||0])}${kv('Upstream',cs(tk[1]))}${kv('Downstream',cs(dn))}</div>
 <div class="card"><h3>Workflow</h3>${kv('Team',w.team)}${kv('Schedule','<code>'+w.cron+'</code>')}${kv('Active version','v'+ac)}${kv('Versions',w.V.length)}${kv('Runs',RUNS.filter(y=>y.p===selWf).length)}${w.paused?kv('Status','paused'):''}</div>`}
const NW=170,NH=46,SC={wait:'--id',run:'--rn',ok:'--ok',fail:'--bd',skip:'--id',hold:'--am',rej:'--bd',retry:'--am'},ST={wait:'waiting',run:'running',ok:'success',fail:'failed',skip:'skipped',hold:'awaiting approval',rej:'rejected',retry:'retrying'};
function graph(r){const T=r.T,lv={},cols=[];
 T.forEach(([id,up])=>{lv[id]=up.length?Math.max(...up.map(u=>lv[u]))+1:0;(cols[lv[id]]=cols[lv[id]]||[]).push(id)});
 const GX=215,GY=66,mx=Math.max(...cols.map(c=>c.length)),H=mx*GY+12,W=(cols.length-1)*GX+NW+20,P={};let s='';

function vDet(){const w=PL[selWf],n=w.V.length,ac=w.act||n,sv=w.sel||ac,L=RUNS.filter(r=>r.p===selWf),r=L.find(x=>x.id===selRun)||L[0];

 if(!r)return h+'<p class="mu">No runs yet. Trigger one above.</p>';
 selRun=r.id;const ids=r.T.map(t=>t[0]);if(!ids.includes(selT))selT=ids.find(i=>['hold','run'].includes(r.k[i].s))||ids[0];
 const hold=ids.find(i=>r.k[i].s==='hold'),tk=r.T.find(t=>t[0]===selT),k=r.k[selT],lt=k.log.join('\n');let b='';
 if(hold){const ap=APR.find(x=>x.r===r.id&&x.g===hold&&x.st==='pending'),y=why(r,ap),at=(a,l,c)=>`<button class="b ${c}" data-a="${a}" data-r="${r.id}" data-g="${hold}" ${y?'disabled':''} title="${y}">${l}</button>`;

 return h+`<div class="wf"><div class="wm"><div class="card"><div class="ch"><b class="m">${r.id}</b><span class="role">v${r.v}</span>${r.ld?`<span class="role">backfill ${r.ld}</span>`:''}${pill(rs(r))}<span class="mu">triggered by ${un(r.by)}</span></div>${b}<div class="sc">${graph(r)}</div>${r.ev&&r.ev.length?`<div class="evs"><div class="mu" style="margin-bottom:4px">Retries and failures in this run. Select a row to open that task's log.</div>${r.ev.map(e=>`<button data-t="${e[1]}"><span class="m mu">${hm(e[0])}</span><span class="m">${e[1]}</span><span class="${/exhausted/.test(e[2])?'lb':/succeeded/.test(e[2])?'lo':'la'}">${e[2]}</span></button>`).join('')}</div>`:''}
 <div class="lp${LOGX?' full':''}"${LOGX?' role="dialog" aria-label="Task log"':''}><div class="mu" style="margin-bottom:6px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center"><span><b class="m">${selT}</b>, ${tk[2]?'human approval gate':`runs on ${EX[tk[3]].n} (${EX[tk[3]].kind})`}</span>${tk[2]?'':`<label>Next runs <select data-fm="1" aria-label="Task behaviour" ${can('run')?'':'disabled'}>${['Healthy','Flaky, succeeds on retry','Broken, fails 3 times'].map((l,i)=>`<option value="${i}" ${((w.fm||{})[selT]||0)===i?'selected':''}>${l}</option>`).join('')}</select></label>`}<button class="b" data-lx="1" style="margin-left:auto" aria-label="${LOGX?'Close expanded log':'Expand log'}">${LOGX?'Close':'Expand'}</button></div><div id="lg" class="lgw" data-n="${k.log.length}">${logHtml(r,selT)}</div></div></div>
 </div><aside class="rs" aria-label="Runs and details">${side(r,w,ac,L)}</aside></div>`}
const vWf=()=>selWf?vDet():`<div class="card tw"><table><tr><th>Workflow</th><th>Team</th><th>Schedule</th><th>Active version</th><th>Latest run</th></tr>${Object.entries(PL).map(([k,p])=>{const l=RUNS.find(r=>r.p===k);return `<tr data-wf="${k}"><td class="m">${p.n}${p.paused?' <span class="mu">(paused)</span>':''}</td><td>${p.team}</td><td class="m">${p.cron}</td><td>v${p.act||p.V.length}</td><td>${l?pill(rs(l)):''}</td></tr>`}).join('')}</table></div>`;

function vAppr(){const pe=APR.filter(a=>a.st==='pending'),dn=APR.filter(a=>a.st!=='pending');
 return (pe.length?pe.map(a=>{const r=RUNS.find(x=>x.id===a.r),y=why(r,a),at=(k,l,c)=>`<button class="b ${c}" data-a="${k}" data-r="${a.r}" data-g="${a.g}" ${y?'disabled':''} title="${y}">${l}</button>`;
  return `<div class="card ap"><div><b class="m">${a.g}</b> in ${PL[a.p].n}, v${r.v}<div class="mu">${a.r}, triggered by ${un(a.by)}, waiting since ${hm(a.t)}, ${a.votes.length} of ${a.q} approvals</div></div><input type="text" id="note-${a.r}${a.g}" placeholder="Add a note for the audit log" aria-label="Decision note"><div class="ar">${at('ok','Approve','pr')}${at('no','Reject','')}<button class="b" data-wf="${a.p}" data-run="${a.r}">Open run</button>${y?`<span class="mu">${y}.</span>`:''}</div></div>`}).join(''):'<p class="mu">No approvals are waiting. Trigger release_train or weekly_pii_purge on its latest version to create one.</p>')
 +`<div class="card tw" style="margin-top:16px"><div class="ch"><b>Decided</b></div><table><tr><th>Gate</th><th>Run</th><th>Decision</th><th>By</th><th>Note</th></tr>${dn.map(a=>`<tr><td class="m">${a.g}</td><td class="m">${a.r}</td><td>${a.st==='approved'?pill('approved','success'):pill('rejected')}</td><td>${a.who}</td><td class="mu">${E(a.note||'')}</td></tr>`).join('')}</table></div>`}

 <div class="card tw" style="margin-top:16px"><div class="ch"><b>Role permissions</b></div><table><tr><th>Role</th>${PERMS.map(p=>`<th>${p}</th>`).join('')}</tr>${Object.keys(ROLES).map(r=>`<tr><td>${r}</td>${PERMS.map(p=>`<td><input type="checkbox" data-rp="${r}|${p}" ${ROLES[r].includes(p)?'checked':''} ${ad&&r!=='admin'?'':'disabled'} aria-label="${r} can ${p}"></td>`).join('')}</tr>`).join('')}</table></div>
 <p class="mu" style="margin-top:12px">${PERMS.map(p=>`<b>${p}</b>: ${PD[p]}`).join('. ')}. Nobody can approve a run they triggered.</p>`}
const vAudit=()=>`<div class="card tw"><table><tr><th>Time</th><th>Who</th><th>Action</th><th>Target</th><th>Note</th></tr>${AUD.map(a=>`<tr><td class="m">${hm(a.t)}</td><td>${a.u}</td><td>${a.a}</td><td class="m">${a.x||''}</td><td class="mu">${E(a.d||'')}</td></tr>`).join('')}</table></div>`;

 const h=VW[view][1]();if(h===vh)return;vh=h;

function trigger(){const p=PL[selWf],v=p.sel||p.act||p.V.length;if(!can('run')||p.paused)return;const r=newRun(selWf,me.id,v);audit(`triggered ${p.n} on v${v}`,r.id);selRun=r.id;selT=null;render()}
function decide(rid,g,ok){const r=RUNS.find(x=>x.id===rid),a=APR.find(x=>x.r===rid&&x.g===g&&x.st==='pending');if(!a||why(r,a))return;
 const n=$('note-'+rid+g),note=n?n.value:'';if(ok)a.votes.push({id:me.id,n:me.n});const done=!ok||a.votes.length>=a.q;if(done){a.st=ok?'approved':'rejected';a.who=ok?a.votes.map(v=>v.n).join(' and '):me.n;a.note=note;r.k[g].s=ok?'ok':'rej'}

function tick(){const now=Date.now();let ch=false;const use={};RUNS.forEach(r=>r.T.forEach(([id,,,x])=>{if(r.k[id].s==='run')use[x]=(use[x]||0)+1}));

  if(k.s==='wait'){const u=up.map(y=>r.k[y].s);
   if(u.some(s=>['fail','skip','rej'].includes(s))){k.s='skip';lg(r,id,'Upstream task did not succeed, marked UPSTREAM_FAILED');ch=true}
