[package]
name = "nozzle-run"
version = "0.1.0"
edition = "2021"
description = "Nozzle local runner: execute YAML workflows via the core scheduler"
license = "MIT"

# The CLI the user invokes is `nzl`; the package (crate `nozzle-run`) keeps
# its name so path dependencies and `cargo run -p nozzle-run` stay stable.
[[bin]]
name = "nzl"
path = "src/main.rs"

[dependencies]
nozzle-core = { path = "../core" }
schemars = "1.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
