[project]
name = "nozzle"
version = "0.1.0"
description = "Simple code-as-workflow engine"
readme = "README.md"
authors = [
    { name = "Nikhil Khule", email = "224297050+n-khule@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []
 
[tool.ruff]
line-length = 80
indent-width = 4
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "F",      # Pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "D",      # pydocstyle
]

# Google-style docstrings.
[tool.ruff.lint.pydocstyle]
convention = "google"

# Keep imports sorted in the same style as Ruff's formatter.
[tool.ruff.lint.isort]
force-single-line = false
combine-as-imports = true

# Ignore rules that tend to conflict with Google's style or
# are generally too noisy for a Google-style project.
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D",      # Tests don't need docstrings everywhere.
]
"__init__.py" = [
    "D104",   # Package docstring not required.
]

[tool.ruff.lint.flake8-bugbear]
# Allow function arguments that are commonly used as dependency
# injection / callbacks.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests", "shared"]
