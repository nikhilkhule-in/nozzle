[project]
name = "nozzle-worker-local"
version = "0.1.0"
description = "Nozzle local worker: poll, execute bundle tasks, report"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "nozzle>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
nozzle = { path = "../../sdk/python" }

[tool.pytest.ini_options]
testpaths = ["tests"]
