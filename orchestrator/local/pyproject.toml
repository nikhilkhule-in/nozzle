[project]
name = "nozzle-orchestrator-local"
version = "0.1.0"
description = "Nozzle local orchestrator: FastAPI + SQLite reference implementation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "nozzle>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
