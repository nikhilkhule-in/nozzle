[package]
name = "nozzle-core-ext"
version = "0.1.0"
edition = "2021"

[lib]
name = "nozzle_core_ext"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.26", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nozzle-core = { path = "../../core" }
