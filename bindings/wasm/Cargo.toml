[package]
name = "nozzle-core-wasm"
version = "0.1.0"
edition = "2021"
description = "Nozzle Rust core compiled to WebAssembly for TypeScript consumers"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nozzle-core = { path = "../../core" }
